# Render Blueprint: one free web service (API + built frontend) backed by a Neon Postgres database.
services:
  - type: web
    name: tasky-automate
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL        # Neon connection string (see README)
        sync: false
      - key: ADMIN_EMAIL         # first admin, created on first start
        sync: false
      - key: ADMIN_PASSWORD      # min 8 chars; can be removed after first login
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: enables real AI task allocation
        sync: false
